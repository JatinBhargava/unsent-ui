<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Diary/Notebook -->
  <rect x="15" y="15" width="70" height="70" fill="#fafafa" stroke="#000" stroke-width="2" rx="4"/>
  <!-- Spine -->
  <line x1="20" y1="15" x2="20" y2="85" stroke="#000" stroke-width="2"/>
  <!-- Lines (pages) -->
  <line x1="30" y1="30" x2="80" y2="30" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="40" x2="80" y2="40" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="50" x2="80" y2="50" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="60" x2="80" y2="60" stroke="#ccc" stroke-width="1"/>
  <line x1="30" y1="70" x2="80" y2="70" stroke="#ccc" stroke-width="1"/>
  <!-- Pen/pencil stroke -->
  <path d="M 35 35 Q 50 40 65 32" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
