name: Unsent UI CI Pipeline

on:
  push:
    branches:
      - feature/**
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

env:
  DOCKER_REGISTRY: jatindocker623
  IMAGE_NAME: unsent-ui
  IMAGE_TAG: 1.0.0-SNAPSHOT

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build UI
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      (startsWith(github.ref, 'refs/heads/develop') || 
       startsWith(github.ref, 'refs/heads/master'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Set version
        id: version
        run: |
          BUILD_TAG="${{ env.IMAGE_TAG }}-${{ github.run_number }}"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKER_REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} \
            -t $DOCKER_REGISTRY/$IMAGE_NAME:${{ steps.version.outputs.BUILD_TAG }} \
            .

      - name: Push Docker image
        run: |
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }}

  notify:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [build]
    if: always()

    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build: SUCCESS"
          else
            echo "❌ Build: FAILED"
          fi
