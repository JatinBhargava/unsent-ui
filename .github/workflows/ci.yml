name: Unsent UI CI Pipeline

on:
  push:
    branches:
      - feature/**
      - release/**
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create a Git tag for this build"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOCKER_REGISTRY: jatindocker623
  IMAGE_NAME: unsent-ui
  IMAGE_TAG: 26.1.1

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Build UI
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      (startsWith(github.ref, 'refs/heads/develop') || 
       startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/release'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Set version
        id: version
        run: |
          BUILD_TAG="${{ env.IMAGE_TAG }}"
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_OUTPUT

      - name: Validate Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USER || vars.DOCKERHUB_USERNAME || vars.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASS || vars.DOCKERHUB_TOKEN || vars.DOCKER_PASS }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "Missing Docker Hub credentials."
            echo "Add either DOCKERHUB_USERNAME + DOCKERHUB_TOKEN or DOCKER_USER + DOCKER_PASS."
            echo "You can set them in Actions Secrets (recommended) or Actions Variables."
            exit 1
          fi

      - name: Diagnostic (safe)
        env:
          HAS_DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USER != '' || vars.DOCKERHUB_USERNAME != '' || vars.DOCKER_USER != '' }}
          HAS_DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN != '' || secrets.DOCKER_PASS != '' || vars.DOCKERHUB_TOKEN != '' || vars.DOCKER_PASS != '' }}
        run: |
          echo "Docker username configured: $HAS_DOCKER_USER"
          echo "Docker password/token configured: $HAS_DOCKER_PASS"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USER || vars.DOCKERHUB_USERNAME || vars.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASS || vars.DOCKERHUB_TOKEN || vars.DOCKER_PASS }}

      - name: Build Docker image
        run: |
          docker build \
            -t $DOCKER_REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }} \
            -t $DOCKER_REGISTRY/$IMAGE_NAME:${{ steps.version.outputs.BUILD_TAG }} \
            .

      - name: Push Docker image
        run: |
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:${{ env.IMAGE_TAG }}
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:${{ steps.version.outputs.BUILD_TAG }}

  tag:
    name: Create Git Tag
    needs: docker
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/heads/release') &&
      inputs.create_tag == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          TAG="ui-${{ env.IMAGE_TAG }}-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged: $TAG"

  notify:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [build, tag]
    if: always()

    steps:
      - name: Build Status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build: SUCCESS"
          else
            echo "❌ Build: FAILED"
          fi
          if [ "${{ needs.tag.result }}" == "success" ]; then
            echo "🏷️ Tag: ui-${{ env.IMAGE_TAG }}-${{ github.run_number }} created"
          elif [ "${{ needs.tag.result }}" == "skipped" ]; then
            echo "⏭️ Tag: skipped (branch not develop/master)"
          else
            echo "❌ Tag: FAILED"
          fi
